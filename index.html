<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dumb_Artist's UT Battle engine v0.1.0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./logo.png" type="image/x-icon">
</head>
<body>
    <div id="stage">
        <img id="enemyGif" alt="">   <!-- animated .gif enemy sprites are shown here (under the canvas) -->
        <canvas id="gameCanvas"></canvas>
    </div>
    <!-- MOBILE CONTROLS: the button in the top-left corner turns them on / off -->
    <button id="mobileToggle" type="button" aria-label="Toggle mobile controls">&#128241;</button>
    <div id="mobileCtl">
        <div id="dpad">
            <button class="mb up"    data-key="arrowup"    type="button">&#9650;</button>
            <button class="mb left"  data-key="arrowleft"  type="button">&#9664;</button>
            <button class="mb right" data-key="arrowright" type="button">&#9654;</button>
            <button class="mb down"  data-key="arrowdown"  type="button">&#9660;</button>
        </div>
        <div id="abtns">
            <button class="mb ab" data-key="x" type="button">X</button>
            <button class="mb ab" data-key="z" type="button">Z</button>
            <button class="mb ab pauseb" data-key="p" type="button">B</button>
        </div>
    </div>
    <p class="hint">Z/Enter confirm &middot; X/Shift cancel + slow soul &middot; Arrows/WASD move &middot; P pause &middot; M mute &middot; V vfx &middot; F3 debug</p>

    <!-- script.js = the engine (you rarely need to touch it). game.js = YOUR game. -->
    <script src="script.js"></script>
    <script src="game.js"></script>
</body>
</html>
